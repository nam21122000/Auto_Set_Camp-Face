# =============================================================================
# FILE CẤU HÌNH MẪU - sao chép file này thành campaigns.yaml rồi chỉnh sửa
# =============================================================================
# Có thể khai báo nhiều campaign trong 1 lần chạy, mỗi campaign nhiều adset,
# mỗi adset nhiều ad. Đặt tên theo đúng mẫu tài khoản đang dùng, ví dụ:
#   Adela Shop-Adela Shop-MDU6507-Nam-26_8-VIDEO-AI

campaigns:
  - name: "Adela Shop-Adela Shop-MDU6507-Nam-26_8-VIDEO-AI"
    objective: "OUTCOME_ENGAGEMENT"   # xem README mục "Objective hợp lệ"
    status: "PAUSED"                 # luôn để PAUSED khi mới tạo, tự bật tay sau khi kiểm tra
    special_ad_categories: []        # ví dụ ["HOUSING"] nếu quảng cáo BĐS/tuyển dụng/tín dụng

    adsets:
      - name: "AdSet - MDU6507"
        daily_budget: 100000          # 100.000 VNĐ/ngày (VND không có phần thập phân)
        billing_event: "IMPRESSIONS"
        optimization_goal: "POST_ENGAGEMENT"
        status: "PAUSED"
        targeting:
          geo_locations:
            countries: ["VN"]
          age_min: 18
          age_max: 45
          genders: []                 # để trống = cả 2 giới tính

        ads:
          # Cách 1: dùng lại bài viết CÓ SẴN trên Fanpage (giống ảnh chụp gốc)
          - name: "Ad - MDU6507"
            page_id: "1294066237122353"
            existing_post_id: "27946023661755962"   # phần số sau dấu "_" của post id
            status: "PAUSED"

